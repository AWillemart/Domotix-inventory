name: Build and Publish Docker Image to GHCR

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Assure un nom d'image valide pour Docker/OCI (minuscules, sans tiret/point/underscore à la fin)
      - name: Sanitize image repository name
        id: prep
        run: |
          RAW_NAME="${{ github.repository }}"
          # Convertir en minuscules (requis par Docker) et supprimer les tirets/points/underscores en fin de chaîne
          CLEAN_NAME=$(echo "$RAW_NAME" | tr '[:upper:]' '[:lower:]' | sed -E 's/[-._]+$//')
          if [ -z "$CLEAN_NAME" ]; then
            CLEAN_NAME="${{ github.repository_owner }}/domotix-inventory"
          fi
          echo "IMAGE_NAME=${CLEAN_NAME}" >> $GITHUB_ENV
          echo "image_name=${CLEAN_NAME}" >> $GITHUB_OUTPUT
          echo "Sanitized Docker image: ghcr.io/${CLEAN_NAME}"

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
